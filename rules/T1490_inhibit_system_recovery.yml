title: Inhibit System Recovery - Ransomware Precursor
id: 9f3c4a2d-6e8b-4d9c-8e4a-3c7d6f9a1b66
status: stable
description: |
  Detects commands that inhibit Windows system recovery — a well-known
  ransomware precursor (ATT&CK T1490). Modern ransomware deletes shadow
  copies, disables recovery, and wipes backup catalogs before encrypting
  files, to prevent victims from restoring.

  Commands covered:
    - vssadmin delete shadows /all
    - wmic shadowcopy delete
    - bcdedit /set recoveryenabled no
    - bcdedit /set bootstatuspolicy ignoreallfailures
    - wbadmin delete catalog
    - wbadmin delete systemstatebackup

references:
  - https://attack.mitre.org/techniques/T1490/
  - https://www.cisa.gov/stopransomware

author: Cyberion Detection Engineering Lab
date: 2026/10/15

tags:
  - attack.impact
  - attack.t1490

logsource:
  product: windows
  service: sysmon
  definition: 'Requires Sysmon Event ID 1 (ProcessCreate)'

detection:
  selection_event:
    EventID: 1

  selection_vssadmin_delete:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'

  selection_wmic_shadowcopy:
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'

  selection_bcdedit_recovery:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains:
      - 'recoveryenabled no'
      - 'bootstatuspolicy ignoreallfailures'

  selection_wbadmin_delete:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains:
      - 'delete catalog'
      - 'delete systemstatebackup'

  condition: selection_event
             and (selection_vssadmin_delete
                  or selection_wmic_shadowcopy
                  or selection_bcdedit_recovery
                  or selection_wbadmin_delete)

fields:
  - Image
  - CommandLine
  - ParentImage
  - User

falsepositives:
  - Legitimate backup rotation that deletes old shadow copies (rare)
  - System administrators disabling recovery for troubleshooting
  - Backup software catalog rotation

level: high