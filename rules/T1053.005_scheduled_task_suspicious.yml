title: Suspicious Scheduled Task Creation via schtasks.exe
id: 3f7c3e60-2b8a-4e3f-9a1d-000000000002
status: experimental
description: Detects suspicious creation of scheduled tasks via schtasks.exe,
    including SYSTEM-level persistence, masquerading task names, and task
    triggers that reference remote or obfuscated payloads.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: Cyberion Detection Engineering Lab
date: 2026-10-09
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\schtasks.exe'
        - OriginalFileName: 'schtasks.exe'
    selection_create:
        CommandLine|contains: '/create'
    selection_suspicious_trigger:
        CommandLine|contains:
            - '/sc onlogon'
            - '/sc onstart'
            - '/sc onidle'
            - '/ru SYSTEM'
            - '/ru "NT AUTHORITY\SYSTEM"'
            - '/rl highest'
    selection_suspicious_action:
        CommandLine|contains:
            - 'powershell'
            - 'pwsh'
            - 'cmd.exe /c'
            - 'cmd /c'
            - 'http://'
            - 'https://'
            - ' -enc '
            - 'IEX'
            - 'DownloadString'
            - 'FromBase64String'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - 'wscript'
            - 'cscript'
    selection_masquerade:
        CommandLine|contains:
            - '\Microsoft\Windows\Update'
            - '\Microsoft\Windows\Google'
            - '\Microsoft\Windows\MicrosoftEdge'
            - '\Microsoft\Windows\WindowsUpdate'
    condition: selection_img and selection_create and (selection_suspicious_trigger or selection_suspicious_action or selection_masquerade)
fields:
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Legitimate software installers creating autoupdate tasks
    - Enterprise management tools (SCCM, Intune) using schtasks remotely
level: high