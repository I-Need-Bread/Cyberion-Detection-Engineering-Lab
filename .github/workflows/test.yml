name: Detection Rule Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-evtx pyyaml

      - name: Verify project structure
        run: |
          if (!(Test-Path "rules")) { throw "rules/ directory missing" }
          if (!(Test-Path "data\EVTX-ATTACK-SAMPLES")) { throw "dataset missing" }

      - name: Count rules
        run: |
          $rules = Get-ChildItem -Path rules -Filter *.yml
          Write-Host "Found $($rules.Count) Sigma rules"
          if ($rules.Count -lt 1) { throw "No Sigma rules found" }

      - name: Validate Sigma YAML syntax
        run: python scripts/validate_sigma.py

      - name: Run all rule test scripts
        run: |
          $tests = Get-ChildItem -Path . -Filter "test_rule_*.py"
          Write-Host "Found $($tests.Count) test scripts"
          $failed = 0
          foreach ($t in $tests) {
              Write-Host ""
              Write-Host "=========================================="
              Write-Host "Running $($t.Name)"
              Write-Host "=========================================="
              python $t.Name
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "FAILED: $($t.Name)"
                  $failed++
              }
          }
          if ($failed -gt 0) { throw "$failed test scripts failed" }

      - name: Check Sigma conversions are up-to-date
        run: python scripts/check_conversions.py
      - name: Upload coverage matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: coverage_matrix.md